<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!--
    Abstract, generic contour-style linework: pure decoration for the homepage hero
    (`cografya_web/DESIGN.md` §6.1 rule 1: brand chrome, never a data encoding). Every path
    below is a hand-drawn wavy curve, NOT a projection of any real place's elevation data,
    so it cannot be mistaken for a factual terrain claim.

    Consumed via CSS mask-image (never rendered directly): the browser reads this document's
    alpha channel, so only the stroke colour matters, never its hex value. The element that
    references this file supplies the visible colour with a CSS custom property, the DESIGN.md
    token layer (`components/home/home.module.css`, `.heroTexture`).

    ONE PRECISE SYNTAX RULE, stated so it is never reintroduced by a future edit: an SVG (or
    any XML) comment MUST NOT contain two consecutive hyphen characters in its body — only at
    its opening/closing delimiter. A rendered before/after test during this task found that
    writing a CSS custom-property token (which is spelled with a leading double hyphen) inside
    THIS comment silently corrupted the whole document for exactly one consumer: a CSS
    mask-image reader parsed it into a fully invisible, empty mask, while every other consumer
    (a browser tab opening the file directly, an inline SVG, an image tag) rendered it
    correctly regardless. That divergence is what made the defect hard to find — a direct file
    load is not the same test as the actual consuming context. There is deliberately no such
    token spelled out literally anywhere in this file any more.
  -->
  <path d="M-20 40 C 110 -10, 250 90, 390 40 S 650 20, 700 60" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 95 C 130 45, 260 145, 410 95 S 650 75, 700 115" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 150 C 150 100, 280 200, 430 150 S 650 130, 700 170" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 205 C 160 155, 300 255, 445 205 S 650 185, 700 225" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 260 C 170 210, 310 310, 455 260 S 650 240, 700 280" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 315 C 180 265, 320 365, 465 315 S 650 295, 700 335" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 370 C 190 320, 330 420, 470 370 S 650 350, 700 390" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M-20 425 C 195 375, 335 475, 475 425 S 650 405, 700 445" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
</svg>
