name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref (keeps the queue lean).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `lib/map/tr-provinces.generated.ts` is an AUTO-GENERATED artifact whose projection
      # constants (`MAP_PROJECTION`) are replayed at runtime by `lib/map/projection.ts` to
      # place markers in the same coordinate space as the 81 outlines. A hand-edit there
      # silently offsets every marker and cannot be reproduced from the source GeoJSON, so
      # the regenerate-and-diff check that the code comments promise runs here. Pure node,
      # no network, ~1s. NOTE: `codegen:check` is the repo's remaining unwired artifact
      # gate — a separate CI-tooling change.
      - name: Map artifact drift
        run: pnpm generate:map:check

      # Same contract for the world map. It carries an extra guarantee the Türkiye artifact
      # does not yet have: the generator THROWS if two countries disagree about a vertex on
      # their shared border (`scripts/lib/map-topology.mjs`), so this step is also the
      # regression gate on border slivers — not just on hand-edits. Pure node, no network.
      - name: World map artifact drift
        run: pnpm generate:world-map:check

      # The inland-water layer is drawn into the SAME pinned frame as the province
      # outlines, on four different surfaces, from a SEPARATE snapshot and generator. That
      # separation is what keeps the ODbL water data out of the public-domain Natural Earth
      # layer, and it is also what makes drift dangerous: if the two artifacts ever stop
      # sharing a frame, every lake slides off its shore while the pages still render, still
      # typecheck and still look like a map. This step re-derives the artifact and fails on
      # any difference; `generate:map:check` above proves the other half — that the pinned
      # frame still reproduces the province paths byte for byte. Pure node, no network (the
      # network step, `scripts/fetch-tr-inland-water.mjs`, is deliberately NOT a pnpm script).
      - name: Inland water artifact drift
        run: pnpm generate:water:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
