name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref (keeps the queue lean).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `lib/map/tr-provinces.generated.ts` is an AUTO-GENERATED artifact whose projection
      # constants (`MAP_PROJECTION`) are replayed at runtime by `lib/map/projection.ts` to
      # place markers in the same coordinate space as the 81 outlines. A hand-edit there
      # silently offsets every marker and cannot be reproduced from the source GeoJSON, so
      # the regenerate-and-diff check that the code comments promise runs here. Pure node,
      # no network, ~1s.
      - name: Map artifact drift
        run: pnpm generate:map:check

      # Same contract for the world map. It carries an extra guarantee the Türkiye artifact
      # does not yet have: the generator THROWS if two countries disagree about a vertex on
      # their shared border (`scripts/lib/map-topology.mjs`), so this step is also the
      # regression gate on border slivers — not just on hand-edits. Pure node, no network.
      - name: World map artifact drift
        run: pnpm generate:world-map:check

      # The inland-water layer is drawn into the SAME pinned frame as the province
      # outlines, on four different surfaces, from a SEPARATE snapshot and generator. That
      # separation is what keeps the ODbL water data out of the public-domain Natural Earth
      # layer, and it is also what makes drift dangerous: if the two artifacts ever stop
      # sharing a frame, every lake slides off its shore while the pages still render, still
      # typecheck and still look like a map. This step re-derives the artifact and fails on
      # any difference; `generate:map:check` above proves the other half — that the pinned
      # frame still reproduces the province paths byte for byte. Pure node, no network (the
      # network step, `scripts/fetch-tr-inland-water.mjs`, is deliberately NOT a pnpm script).
      - name: Inland water artifact drift
        run: pnpm generate:water:check

      # `lib/api/schema.ts` is codegen output (`openapi-typescript` over the committed
      # `openapi/openapi.json`) and is the web half of the cross-repo DTO contract
      # (`CONVENTIONS.md` §3). CORRECTED (PR #83 review `CODE83-M1`): it has been consumed
      # INDIRECTLY, through `lib/api/types.ts`'s aliases, by 68 other modules since PR #5
      # (measured: `grep -rl 'from "@/lib/api/types"' | grep -v lib/auth/ | wc -l`) — so the
      # gate's absence until now was an open risk that a drifted schema could already break
      # a real call site silently, not a deferred convenience for code that did not exist
      # yet. UYELIK-03 adds the first DIRECT consumers — `lib/auth/transport.server.ts` and
      # `lib/auth/session.ts`'s compile-time drift-agreement assertions — which is what
      # finally wires the check here: a spec copied without a regenerate, or a hand-edit in
      # the generated file, must fail here rather than at a runtime type that silently
      # disagrees with the api. Pure node, no network.
      # Verified byte-reproducible at web `dev` 608922f before wiring (plan §2 M7).
      - name: OpenAPI codegen drift
        run: pnpm codegen:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
