name: Deploy Web

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Map artifact drift
        run: pnpm generate:map:check

      - name: World map artifact drift
        run: pnpm generate:world-map:check

      - name: Inland water artifact drift
        run: pnpm generate:water:check

      - name: TR context artifact drift
        run: pnpm generate:tr-context:check

      # `docs/design.md`'s frontmatter is generated from `app/globals.css` for impeccable's detector
      # and live panel. Regenerate and diff, like the map artifacts. Pure node, no network.
      - name: Design token frontmatter drift
        run: pnpm design:tokens:check

      - name: OpenAPI codegen drift
        run: pnpm codegen:check

      - name: Unit Tests
        run: pnpm test

  deploy-web:
    name: Deploy to Production
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$USER@$HOST" << 'EOF'
            set -euo pipefail
            echo "==> Pulling latest Web code on production server..."
            cd /opt/cografya/cografya_web
            git fetch origin main
            git reset --hard origin/main

            cd /opt/cografya

            # The web image PRERENDERS ~980 data routes at build time, so `build web` needs the
            # API answering on the host's 127.0.0.1:3001 (docker-compose.prod.yml gives the web
            # build `network: host`). Two things follow, both load-bearing:
            #
            # 1. `up -d api` must run BEFORE the build. Editing the compose file to add api's
            #    `ports: ["127.0.0.1:3001:3001"]` does NOT republish the port on the container
            #    already running — only a recreate does. Without this step, the first deploy
            #    after that edit reaches nothing at :3001, the prerender floor guard FAILs and
            #    the deploy wedges until a human intervenes. It is a no-op whenever the running
            #    api already matches the file; when it does not, it briefly restarts the API
            #    (seconds, and only on the one deploy that applies the change).
            # 2. `--build`/`--deps` are both refused. `--no-build`: a WEB deploy must never build
            #    or ship an API image — a missing api image is the api repo's deploy to fix, and
            #    this fails loudly instead of quietly compiling whatever happens to be in
            #    /opt/cografya/cografya_api. `--no-deps` is equally deliberate: without it,
            #    `up api` also converges api's `depends_on`, so a web deploy could recreate the
            #    production postgres container if the hand-edited compose file ever drifted on
            #    it. It gives up the `service_healthy` wait on postgres/redis, and that trade is
            #    right: an api recreated while postgres is down crash-loops, publishes no port,
            #    and lands loudly on the 3001 check below — whereas recreating the production
            #    database from a web deploy has no loud failure mode at all. Matches
            #    `up -d --no-deps web` further down.
            echo "==> Ensuring the API is up and published for the web build..."
            docker compose -f docker-compose.prod.yml up -d --no-build --no-deps api

            # The one way the host's compose file can be wrong that otherwise fails SILENTLY:
            # `- "3001:3001"` instead of `- "127.0.0.1:3001:3001"`. The build succeeds and the
            # floor guard goes green, but the API is then world-reachable on the production
            # host, bypassing Caddy, with INTERNAL_REQUEST_TOKEN travelling in clear over plain
            # HTTP. Every other way that file can be wrong already fails loudly and by name;
            # this closes the last one, and it FAILS the deploy rather than warning.
            # `ps --format '{{.Ports}}'` is used rather than `compose port api 3001` because it
            # lists EVERY host binding of the running container, not just the first one — so a
            # stray wide publish sitting alongside a correct loopback publish is caught too.
            echo "==> Verifying the API is published on loopback only..."
            API_PORTS="$(docker compose -f docker-compose.prod.yml ps --format '{{.Ports}}' api)"
            BINDINGS_3001="$(printf '%s\n' "$API_PORTS" | tr ',' '\n' | sed 's/^ *//' | grep -- '->3001/tcp' || true)"
            if [ -z "$BINDINGS_3001" ]; then
              echo "ERROR: the api service publishes no host port for 3001 (saw: '$API_PORTS')." >&2
              echo "       docker-compose.prod.yml's api service needs:" >&2
              echo "         ports:" >&2
              echo "           - \"127.0.0.1:3001:3001\"" >&2
              echo "       'docker compose ps' prints nothing and exits 0 for an unknown service, so" >&2
              echo "       this also fires if the api service is missing, renamed or misspelled in the" >&2
              echo "       compose file, or if the container is crash-looping and publishing nothing." >&2
              echo "       The web build prerenders ~980 routes and cannot reach the API without it." >&2
              exit 1
            fi
            NON_LOOPBACK="$(printf '%s\n' "$BINDINGS_3001" | grep -v -e '^127\.0\.0\.1:' -e '^\[::1\]:' || true)"
            if [ -n "$NON_LOOPBACK" ]; then
              echo "ERROR: the api service publishes 3001 off loopback:" >&2
              echo "$NON_LOOPBACK" >&2
              echo "       That exposes the API to the internet, bypassing Caddy, with" >&2
              echo "       INTERNAL_REQUEST_TOKEN sent in clear. Fix docker-compose.prod.yml to" >&2
              echo "         ports:" >&2
              echo "           - \"127.0.0.1:3001:3001\"" >&2
              echo "       then re-run the deploy. Refusing to deploy." >&2
              exit 1
            fi
            echo "    api published on loopback only: $BINDINGS_3001"

            echo "==> Building Web container (Next.js standalone)..."
            docker compose -f docker-compose.prod.yml build web

            echo "==> Restarting Web container..."
            docker compose -f docker-compose.prod.yml up -d --no-deps web

            # Readiness, not a fixed wait. `up -d` returns once the container STARTS; a server
            # that crashes on boot used to finish this deploy green after `sleep 5`. The probe is
            # the image's own `healthcheck.mjs` (also the Dockerfile HEALTHCHECK), run inside the
            # NEW container because web publishes no host port. Bounded by wall-clock time, not
            # attempts: one attempt can take up to 20 s when the API hangs.
            #
            # `</dev/null` ON EVERY `exec` IS LOAD-BEARING. This whole script reaches the host as
            # ssh's stdin, and `docker compose exec` forwards its stdin into the container: without
            # the redirect the first probe swallowed the rest of the script, bash hit EOF and the
            # deploy ended green without ever checking the result (the first run of this block
            # did exactly that). `scripts/deploy-health.test.ts` fails on an `exec` without it.
            echo "==> Waiting for the web container to answer /api/health (up to 120 s)..."
            HEALTH=""
            DEADLINE=$((SECONDS + 120))
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              if HEALTH="$(docker compose -f docker-compose.prod.yml exec -T web node healthcheck.mjs </dev/null 2>/dev/null)"; then
                break
              fi
              HEALTH=""
              sleep 2
            done
            if [ -z "$HEALTH" ]; then
              echo "ERROR: the web container never answered /api/health. Last log lines:" >&2
              docker compose -f docker-compose.prod.yml ps web >&2 || true
              docker compose -f docker-compose.prod.yml logs --tail 50 web >&2 || true
              exit 1
            fi
            echo "    $HEALTH"
            # The web deploy did not cause an API outage, so it does not fail on one; it says so.
            case "$HEALTH" in
              *'"api":"ok"'*) ;;
              *) echo "WARNING: web is up but reports the API as unreachable." >&2 ;;
            esac

            # The container answering is not the site answering: Caddy has to reach it over the
            # compose network too. Asked from inside the caddy container (busybox `wget` ships in
            # caddy:2-alpine; the host is not assumed to have curl). The Caddyfile's `:80` block
            # serves any Host, so no Host header is needed.
            echo "==> Verifying Caddy reaches the new container..."
            if ! docker compose -f docker-compose.prod.yml exec -T caddy wget -q -T 25 -O - http://127.0.0.1/api/health </dev/null; then
              echo "ERROR: Caddy did not return a healthy /api/health from the new container." >&2
              exit 1
            fi
            echo
            echo "==> Web Deployment completed successfully! 🚀"
          EOF
