<svg xmlns="http://www.w3.org/2000/svg" id="flag-qn" viewBox="0 0 3 2" preserveAspectRatio="xMidYMid meet">
  <!--
    Flag of the Turkish Republic of Northern Cyprus (QN), reconstructed by Cografya.

    GEOMETRY comes from ONE source: the dimension table published by the TRNC Ministry of
    National Education ("KKTC Bayrağının Ölçüleri", https://www.mebnet.net/KKTCBayragi),
    which 15/1984 Bayrak Yasası m.2 backs. No pixel, path or outline was traced from that
    page's dimension JPEG or from any third-party QN SVG (→ DEC 2026-08-08p).

    Normalised G = 2 (height), L = 1.5 G = 3 (length), so the viewBox is the flag's own 3:2
    ratio. The 4:3 card that shows it is only a container: the image is centred with
    `contain`, never cropped and never stretched.

      A = 1/2 G  = 1        outer crescent circle, cx
      B = 1/2 G  = 1        outer crescent circle, diameter  -> r = .5
      C = 1/16 G = .125     inner circle offset toward the fly -> cx = 1.125
      D = 2/5 G  = .8       inner circle diameter -> r = .4
      E = 1/3 G  = .666667  clearance between the inner circle and the star's circle
      F = 1/4 G  = .5       star's circumscribed circle -> R = .25
      N = 1/10 G = .2       red band
      O = 1/10 G = .2       white band between each edge and its red band
      M = 1/30 G            hoist sleeve: a sewing dimension, not a drawn element

    Star centre: 1.125 + .4 + 2/3 + .25 = 293/120 = 2.441667. Inner vertex radius is the
    regular pentagram's own consequence, R * (3 - sqrt5)/2 = .0954915.

    TWO VALUES ARE PRODUCT CHOICES, NOT OFFICIAL FACTS, and are recorded as such in
    provenance/datasets.md. The examined official texts say only "al" (crimson) and fix no
    numeric colour, and the table fixes no rotation for the star:
      * #e30a17 is the red of tr.svg in the pinned flag-icons@7.5.0, taken for consistency
        with the other 198 flags in the set. It is NOT an official TRNC hex.
      * the star is turned so that one vertex points at the hoist, derived from the same
        pinned artifact. It is NOT an official TRNC angle.

    The crescent is painted, not subtracted: the inner circle reaches .025 past the outer
    one, so an even-odd difference would fill that protruding lens. White over white leaves
    it invisible, which is why the order below matters.
  -->
  <rect x="0" y="0" width="3" height="2" fill="#fff"/>
  <rect x="0" y="0.2" width="3" height="0.2" fill="#e30a17"/>
  <rect x="0" y="1.6" width="3" height="0.2" fill="#e30a17"/>
  <circle cx="1" cy="1" r="0.5" fill="#e30a17"/>
  <circle cx="1.125" cy="1" r="0.4" fill="#fff"/>
  <polygon fill="#e30a17" points="2.643921,0.853054 2.471175,0.909182 2.364412,0.762236 2.364412,0.943872 2.191667,1 2.364412,1.056128 2.364412,1.237764 2.471175,1.090818 2.643921,1.146946 2.537158,1"/>
</svg>
